<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PRICEOFTRUTH</title>
    <!-- Cache bust: new-video-shhhitisalmostdone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="The Six Billion Dollar Man" />
  <meta property="og:description" content="Julian Assange and the Price of Truth - A Film by Eugene Jarecki" />
  <meta property="og:image" content="https://csfilms.github.io/6BDM/preview.jpeg" />
  <meta property="og:url" content="https://csfilms.github.io/6BDM/" />
  <meta property="og:type" content="website" />
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Six Billion Dollar Man" />
  <meta name="twitter:description" content="Julian Assange and the Price of Truth - A Film by Eugene Jarecki" />
  <meta name="twitter:image" content="https://csfilms.github.io/6BDM/preview.jpeg" />
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- SVG Filters for video effects -->
  <svg style="display: none;">
    <defs>
      <!-- Pixelation filter - creates blocky/low-res look -->
      <filter id="pixelate-filter" x="0" y="0" width="100%" height="100%">
        <feFlood x="2" y="2" height="1" width="1"/>
        <feComposite width="5" height="5"/>
        <feTile result="tile"/>
        <feComposite in="SourceGraphic" in2="tile" operator="in"/>
        <feMorphology operator="dilate" radius="2.5"/>
      </filter>
    </defs>
  </svg>

  <!-- video2 removed - defunct -->

  <div class="video-container" id="video-container">
  <video
    id="bg-video3"
    class="bg-video bg-video3"
    playsinline
    preload="metadata"
    aria-hidden="true"
    tabindex="-1"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate noptimizequality nodatachannel"
    volume="1"
  >
     <!-- Mobile devices will use the smaller video, desktop uses the full quality -->
     <source id="video-source" src="" type="video/mp4" />
  </video>
  </div>
  
  <!-- Video play button -->
  <div id="video-play-button">
    <div id="video-play-triangle"></div>
  </div>
  
  <!-- Text overlay on top of video -->
  <div id="video-text-overlay" style="display: none;">
    A FILM BY EUGENE JARECKI
  </div>
  
  <!-- Scanline patch over video text -->
  <div id="video-text-scanlines"></div>
  
  <!-- Scanline patch over navbar -->
  <div id="nav-scanlines"></div>
  
  <!-- Text unscramble audio -->
  <audio id="text-audio" preload="auto">
    <source src="TEXTAUDIO.mp4" type="audio/mp4">
  </audio>
  
  <!-- Scramble audio (computer readout) -->
  <audio id="scramble-audio" preload="auto">
    <source src="audio/ComputerReadout-1.wav" type="audio/wav">
  </audio>
  
  <!-- Typing audio -->
  <audio id="typing-audio" preload="auto">
    <source src="audio/speduptyping.wav" type="audio/wav">
  </audio>
  
  <!-- Video audio track -->
  <audio id="video-audio" preload="auto">
    <source src="VIDEOS/FADELONG.wav" type="audio/wav">
  </audio>
  
  <!-- Alien message audio (slide-3 intro) -->
  <audio id="alien-audio" preload="auto" loop>
    <source src="audio/ShortEncryptedAlienMessage.wav" type="audio/wav">
  </audio>
  <!-- Scanline overlay on top of everything -->
  <div id="scanline-overlay"></div>

  <!-- OBIWAN_REAL audio removed - defunct -->

  <div class="bg-overlay" id="bg-overlay"></div>

  <!-- Carousel Container -->
  <div id="carousel-container"></div>

  <div id="nav">
    <span id="nav-prev">&lt;</span>
    <span id="nav-msg"></span>
    <span id="nav-next">&gt;</span>
  </div>

  <div id="slide-counter">SLIDE 1 / 1</div>

  
  <!-- Custom cursor -->
  <div id="custom-cursor"></div>

  <!-- External JavaScript Module -->
  <script type="module" src="js/main.js"></script>
  
</body>
</html>
